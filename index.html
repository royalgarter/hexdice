<body class="text-black min-h-screen flex flex-col items-center font-mono"
	x-data="alpineHexDiceTacticGame()"
	@mousemove.window="cursorX = $event.clientX; cursorY = $event.clientY">

	<!-- Dice Container -->
	<div x-init="loadComponent($el, 'dice')"></div>

	<!-- Hex Grid Container -->
	<div class="flex-grow flex items-start justify-center w-full overflow-auto my-6" style="max-height: min-content;">
		<!-- Campaign Map Background -->
		<template x-if="isCampaign && !autochess">
			<div class="hex-grid-campaign-background fixed" :style="hexGrid.style" x-show="showMinimap">
			</div>
		</template>
		<!-- Hex Grid (contains unit-info-panel, auth, toolbars) -->
		<div x-init="loadComponent($el, 'hex-grid')"></div>
	</div>

	<!-- Autochess UI Overlay -->
	<div x-init="loadComponent($el, 'autochess')" style="max-height: min-content;"></div>

	<!-- Puzzle HUD -->
	<div x-init="loadComponent($el, 'puzzle')" class="w-full flex justify-center"></div>

	<!-- Game Controller -->
	<div x-init="loadComponent($el, 'controller')" style="max-height: min-content;"></div>

	<!-- Message Log -->
	<div x-init="loadComponent($el, 'log')"></div>

	<!-- Cursor sprite follower -->
	<template x-if="cursorSprite">
		<div class="fixed pointer-events-none z-90 font-bold text-lg" x-text="cursorSprite"
			:style="`left: ${cursorX + 12}px; top: ${cursorY - 8}px; width: 2rem; height: 2rem;`"
		></div>
		<!-- <img
			:src="cursorSprite" :alt="cursorSprite"
			class="fixed pointer-events-none z-90"
			:style="`left: ${cursorX + 12}px; top: ${cursorY - 8}px; width: 32px; height: 32px;`"
		> -->
	</template>

	<div id="midi-container" style="display: none;"></div>

	<!-- Devotion Menu (The Camp) -->
	<div x-init="loadComponent($el, 'camp')"></div>

	<!-- World Map -->
	<div x-init="loadComponent($el, 'worldmap')"></div>

</body>
